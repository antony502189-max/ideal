name: Search exact SFT canary rows

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Search dataset viewer
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          from pathlib import Path
          phrase='sandpit-truth-blunt'
          datasets=[
            'HuggingFaceTB/magpie-ultra-v1.0-top-300K-short-H4',
            'HuggingFaceTB/OpenHermes-2.5-H4-200k',
            'HuggingFaceTB/ifeval-like-data-36k-H4',
            'HuggingFaceTB/everyday-conversations-llama3.1-2k',
            'HuggingFaceTB/self-oss-instruct-sc2-H4',
            'HuggingFaceTB/summarization-data-10k-H4',
            'HuggingFaceTB/smollm-v2-summarization',
            'HuggingFaceTB/smollm-v2-rewriting-50k-H4',
            'HuggingFaceTB/explore-instruct-rewrite-H4',
            'HuggingFaceTB/LongAlign-16k-ctx-english-H4',
          ]
          base='https://datasets-server.huggingface.co'
          def get(path,params):
            url=base+path+'?'+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          out=[]
          for ds in datasets:
            try: sp=get('/splits',{'dataset':ds}).get('splits',[])
            except Exception as e:
              out.append({'dataset':ds,'error_splits':repr(e)});continue
            print('DS',ds,[(x['config'],x['split']) for x in sp],flush=True)
            for x in sp:
              cfg,split=x['config'],x['split']
              probes=[]
              for q in [phrase,*phrase.split('-')]:
                try:
                  d=get('/search',{'dataset':ds,'config':cfg,'split':split,'query':q,'offset':0,'length':100})
                  rows=d.get('rows',[])
                  exact=[r for r in rows if phrase in json.dumps(r,ensure_ascii=False)]
                  probes.append({'q':q,'total':d.get('num_rows_total'),'exact':exact})
                  if exact: print('FOUND',ds,cfg,split,q,len(exact),flush=True)
                except Exception as e: probes.append({'q':q,'error':repr(e)})
              out.append({'dataset':ds,'config':cfg,'split':split,'probes':probes})
          Path('sft-search.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sft-search
          path: sft-search.json
